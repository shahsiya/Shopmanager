<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин</title>
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .product { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; width: 200px; }
    .cart { position: fixed; top: 10px; right: 10px; background: #f5f5f5; padding: 15px; border: 1px solid #ccc; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Товары</h1>
  <div id="products"></div>
  <div class="cart">
    <h3>Корзина</h3>
    <div id="cart-items"></div>
    <p>Итого: <span id="total-price">0</span> грн</p>
    <button onclick="checkout()">Оформить заказ</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const products = [
      { id: "1", name: "Куртка", price: 1200 },
      { id: "2", name: "Шапка", price: 300 },
      { id: "3", name: "Перчатки", price: 450 }
    ];

    const cart = [];

    function renderProducts() {
      const container = document.getElementById('products');
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <h3>${p.name}</h3>
          <p>${p.price} грн</p>
          <button onclick='addToCart(${JSON.stringify(p)})'>Добавить</button>
        `;
        container.appendChild(div);
      });
    }

    window.addToCart = function (product) {
      const existing = cart.find(item => item.id === product.id);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      renderCart();
    };

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;
      cart.forEach(item => {
        total += item.price * item.quantity;
        container.innerHTML += `<p>${item.name} x${item.quantity}</p>`;
      });
      document.getElementById('total-price').innerText = total;
    }

    window.checkout = function () {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          alert("Сначала войдите в аккаунт.");
          return;
        }
        if (cart.length === 0) {
          alert("Корзина пуста.");
          return;
        }

        await addDoc(collection(db, "orders"), {
          email: user.email,
          items: cart,
          total: cart.reduce((sum, item) => sum + item.price * item.quantity, 0),
          status: "Принят",
          date: new Date().toISOString()
        });

        alert("Заказ оформлен успешно!");
        cart.length = 0;
        renderCart();
      });
    };

    renderProducts();
  </script>
</body>
</html>
