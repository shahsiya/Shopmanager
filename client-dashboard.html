<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кабинет клиента</title>
</head>
<body>
  <h1>Добро пожаловать, <span id="userEmail"></span></h1>
  <button id="logoutBtn">Выйти</button>
  <div id="ordersContainer"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBYSoT1yJgt0upA08gkeZoq-FLI0kmqjYk",
      authDomain: "shopmanager-c9f0b.firebaseapp.com",
      projectId: "shopmanager-c9f0b",
      storageBucket: "shopmanager-c9f0b.appspot.com",
      messagingSenderId: "1029319736818",
      appId: "1:1029319736818:web:bbfb48553e318955ec3f6b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    console.log('DB init:', db);

    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
        window.location.href = 'login.html';
      } catch (error) {
        console.error('Ошибка выхода:', error);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('userEmail').textContent = user.email;
        loadUserOrders(user.email);
      } else {
        window.location.href = 'login.html';
      }
    });

    async function loadUserOrders(userEmail) {
      const ordersContainer = document.getElementById('ordersContainer');
      ordersContainer.innerHTML = '';

      try {
        const ordersRef = collection(db, 'orders');
        const q = query(ordersRef, where('email', '==', userEmail));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          ordersContainer.innerHTML = '<p>У вас пока нет заказов.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const order = doc.data();
          const card = document.createElement('div');
          card.className = 'clientOrderCard';

          card.innerHTML = `
            <h3>Заказ №${doc.id}</h3>
            <p><strong>Товар:</strong> ${order.product || 'Не указан'}</p>
            <p><strong>Статус:</strong> ${order.status || 'Ожидает'}</p>
            <p><strong>Дата заказа:</strong> ${order.timestamp?.toDate().toLocaleString() || '—'}</p>
          `;
          ordersContainer.appendChild(card);
        });
      } catch (error) {
        console.error('Ошибка загрузки заказов:', error);
        ordersContainer.innerHTML = '<p>Ошибка загрузки заказов.</p>';
      }
    }
  </script>
</body>
</html>
