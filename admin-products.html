<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Управление товарами</title>
  <script type="module" src="admin-products.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Панель управления товарами</h1>
  <p>Вы вошли как: <span id="adminEmail"></span></p>
  <button id="logoutBtn">Выйти</button>

  <h2>Добавить товар</h2>
  <form id="productForm">
    <input type="text" id="title" placeholder="Название товара" required>
    <input type="text" id="description" placeholder="Описание">
    <input type="number" id="price" placeholder="Цена" required>
    <input type="text" id="image" placeholder="Ссылка на изображение">
    <button type="submit">Сохранить</button>
  </form>

  <h2>Список товаров</h2>
  <div id="productsContainer"></div>
</body>
</html>
