<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Управление товарами - ShopManager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Управление товарами</h1>
    <!-- Ссылки для навигации -->
    <button onclick="window.location.href='admin-dashboard.html'">
      Назад к заказам
    </button>
    <button id="logoutBtn">Выйти</button>
  </header>

  <main>
    <!-- Форма добавления / редактирования -->
    <section>
      <h2>Добавить / Редактировать товар</h2>
      <form id="productForm">
        <input type="hidden" id="productId" />
        <input type="text" id="productName" placeholder="Название товара" required />
        <input type="number" id="productPrice" placeholder="Цена (₽)" required />
        <button type="submit" id="saveBtn">Сохранить</button>
        <button type="button" id="cancelBtn" style="display:none;">Отменить</button>
      </form>
    </section>

    <!-- Список товаров -->
    <section>
      <h2>Список товаров</h2>
      <div id="productsContainer">
        <p>Загрузка товаров...</p>
      </div>
    </section>
  </main>

  <script type="module" src="admin-products.js"></script>
</body>
</html>
