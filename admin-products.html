<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Управление товарами - ShopManager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Управление товарами</h1>
    <button onclick="window.location.href='admin-dashboard.html'">Назад к заказам</button>
    <button id="logoutBtn">Выйти</button>
  </header>

  <main>
    <section>
      <h2>Добавить / Редактировать товар</h2>
     <!-- Заменяем поле URL картинки на загрузчик файла -->
<form id="productForm">
  <input type="hidden" id="productId" />

  <label for="productName">Название</label>
  <input type="text" id="productName" required />

  <label for="productSKU">SKU</label>
  <input type="text" id="productSKU" required />

  <label for="productPrice">Цена (₽)</label>
  <input type="number" id="productPrice" required />

  <label for="productStock">Остаток (шт.)</label>
  <input type="number" id="productStock" required />

  <label for="productImageFile">Изображение</label>
  <input type="file" id="productImageFile" accept="image/*" />

  <button type="submit" id="saveBtn">Сохранить</button>
  <button type="button" id="cancelBtn" style="display:none;">Отменить</button>
</form>

    </section>

    <section>
      <h2>Список товаров</h2>
      <div id="productsContainer">
        <p>Загрузка товаров...</p>
      </div>
    </section>
  </main>

  <script type="module" src="admin-products.js"></script>
</body>
</html>
