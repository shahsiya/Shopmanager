<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      background: #f9f9f9;
    }
    h2 {
      margin-top: 40px;
    }
    .order-card, .product-card {
      background: #fff;
      padding: 12px;
      margin: 12px 0;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
    }
    button {
      margin-left: 8px;
      cursor: pointer;
    }
    input[type="text"], input[type="number"] {
      padding: 6px 8px;
      margin-right: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
      width: 200px;
    }
    form > input, form > button {
      margin-bottom: 10px;
    }
    #logoutBtn {
      background: #d9534f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
      margin-top: -40px;
    }
  </style>
</head>
<body>

  <button id="logoutBtn">Выйти</button>
  <h1>Панель администратора</h1>

  <!-- Форма добавления заказа -->
  <section>
    <h2>Добавить заказ</h2>
    <form id="addOrderForm">
      <input name="email" type="email" placeholder="Email клиента" required />
      <input name="clientName" type="text" placeholder="Имя клиента" required />
      <input name="deliveryAdres" type="text" placeholder="Адрес доставки" required />
      <input name="product" type="text" placeholder="Описание товара" required />
      <input name="price" type="number" placeholder="Цена" required />
      <input name="status" type="text" placeholder="Статус заказа" />
      <input name="trackingNumber" type="text" placeholder="Трек номер" />
      <button type="submit">Добавить заказ</button>
    </form>
  </section>

  <!-- Контейнер для заказов -->
  <section id="ordersContainer">
    <!-- Заказы будут подгружаться сюда -->
  </section>

  <!-- Контейнер для товаров (создаётся динамически через JS после заказов) -->

  <script type="module" src="admin-dashboard.js"></script>
</body>
</html>
